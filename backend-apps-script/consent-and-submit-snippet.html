<!-- Place this inside the post-webinar/exit-ticket section. -->
<section class="research-consent-box" aria-labelledby="researchConsentTitle">
  <h3 id="researchConsentTitle"
      data-en="ANONYMOUS RESEARCH CONSENT"
      data-bm="PERSETUJUAN PENYELIDIKAN TANPA NAMA">
    ANONYMOUS RESEARCH CONSENT
  </h3>
  <label>
    <input type="checkbox" id="researchConsent">
    <span data-en="I voluntarily agree that my anonymous survey responses may be used for research and publication. No name or email address will be collected."
          data-bm="Saya bersetuju secara sukarela bahawa respons tinjauan tanpa nama saya boleh digunakan untuk penyelidikan dan penerbitan. Nama dan alamat e-mel tidak akan dikumpulkan.">
      I voluntarily agree that my anonymous survey responses may be used for research and publication. No name or email address will be collected.
    </span>
  </label>
  <button type="button" id="submitResearchData"
          data-en="SUBMIT ANONYMOUS RESPONSE"
          data-bm="HANTAR RESPONS TANPA NAMA">
    SUBMIT ANONYMOUS RESPONSE
  </button>
  <p id="researchSubmitStatus" role="status" aria-live="polite"></p>
</section>
